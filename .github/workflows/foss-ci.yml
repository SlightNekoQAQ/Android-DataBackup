name: DataBackup FOSS CI

on:
  pull_request:
    branches: [cloud-backup]
  push:
    branches: [cloud-backup, 'feature/cloud-pool']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: recursive
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare verified Gopeed kernels
        run: bash core/network/gopeed-kernel.sh
      - name: Test cloud backup core and build installable APKs
        shell: bash
        run: |
          tasks=(assembleArm64-v8aFossDebug)
          if [[ "$GITHUB_REF" == refs/heads/cloud-backup ]]; then
            tasks+=(assembleArmeabi-v7aFossDebug assembleX86FossDebug assembleX86_64FossDebug)
          fi
          bash ./gradlew --no-daemon :core:data:testDebugUnitTest "${tasks[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: DataBackup-FOSS-debug-${{ github.sha }}
          path: source/app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
